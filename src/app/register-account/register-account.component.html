<div class="py-4">
  <h2 class="mb-4">Register Account</h2>
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          @if (error) {
            <div class="alert alert-warning mb-3">{{ error }}</div>
          }
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="model.name" name="name" placeholder="Full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Street <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="model.street" name="street" placeholder="Street address" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">City <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="model.city" name="city" placeholder="City" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">State <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="model.state" name="state" placeholder="State" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Postal Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="model.postalCode" name="postalCode" placeholder="Zip" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Country <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="model.country" name="country" placeholder="Country" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" [(ngModel)]="model.phone" name="phone" placeholder="Phone number" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" [(ngModel)]="model.email" name="email" placeholder="you&#64;example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" [(ngModel)]="model.password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="submitting">
              {{ submitting ? 'Registering…' : 'Register' }}
            </button>
            <a routerLink="/catalog" class="btn btn-outline-secondary w-100">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
