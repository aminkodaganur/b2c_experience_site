<div class="py-4">
  <h2 class="mb-4">Register Account</h2>
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" [(ngModel)]="model.name" name="name" placeholder="Your name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="model.email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" [(ngModel)]="model.password" name="password" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" [(ngModel)]="model.confirmPassword" name="confirmPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Register</button>
            <a routerLink="/catalog" class="btn btn-outline-secondary w-100">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
