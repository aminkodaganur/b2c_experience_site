@if (toast.message | async; as msg) {
  <div class="toast-container" role="alert" aria-live="polite">
    <div class="toast-message toast-success">{{ msg }}</div>
  </div>
}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
  <div class="container">
    <a class="navbar-brand" routerLink="/">{{ title }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" routerLink="/catalog" routerLinkActive="active">Catalog</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a></li>
        <li class="nav-item">
          <a class="nav-link cart-btn" routerLink="/cart" routerLinkActive="active">
            <span class="cart-btn-icon" aria-hidden="true">&#128722;</span>
            Cart
            @if ((cart.cartCount$ | async); as count) {
              <span class="cart-count" [class.cart-count--zero]="count === 0">{{ count }}</span>
            }
          </a>
        </li>
        <li class="nav-item"><a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container">
  <router-outlet></router-outlet>
</main>
<footer class="bg-light py-3 mt-5 text-center text-muted small">
  &copy; {{ title }}
</footer>
